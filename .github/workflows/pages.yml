# Publishes the site to GitHub Pages and inserts the NASA API key from the repository secret NASA_API_KEY.
# The key never appears in the repository files.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site and insert NASA API key
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: |
          mkdir -p _site
          cp *.html *.js *.css _site/
          cp *.jpg *.md _site/ 2>/dev/null || true
          if [ -n "$NASA_API_KEY" ]; then
            sed -i "s/__NASA_API_KEY__/${NASA_API_KEY}/" _site/data.js
            echo "NASA API key inserted"
          else
            echo "No NASA_API_KEY secret set: the site will use DEMO_KEY"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
