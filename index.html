<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Neighbor's Map — Interplanetary Survival Guide</title>
<meta name="description" content="A layered, multi-mission map of all of Mars with a safety-first Marswalk (EVA) planner. NASA Space Apps Challenge 2026.">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23c1440e'/><circle cx='11' cy='11' r='4' fill='%23ffb38a' opacity='.7'/></svg>">
</head>
<body>
<div id="app">
  <div id="mapwrap"><div id="map"></div></div>

  <!-- LEFT: brand + search for a base (Google-Maps style) -->
  <section id="leftPanel" class="float">
    <div class="brand"><div class="dot"></div><div><h1>Our Neighbor's Map</h1><small>Interplanetary Survival Guide</small></div>
      <button class="iconbtn" id="btnTour" title="How to use this map" aria-label="Show the guided tour">?</button></div>
    <div class="searchbox"><span>⌕</span><input type="text" id="q" placeholder="Search a base: Jezero, Olympus Mons, 18.4N 77.5E…" autocomplete="off"></div>
    <div class="searchres" id="qres"></div>
    <div id="placeCard"></div>
  </section>

  <!-- RIGHT: modes -->
  <aside id="rightPanel" class="float">
    <div class="tabs">
      <button data-tab="layers" class="on" title="Map layers"><i>◧</i>Layers</button>
      <button data-tab="plan" title="Plan an EVA"><i>⛯</i>Plan EVA</button>
      <button data-tab="cond" title="Conditions"><i>☀</i>Conditions</button>
      <button data-tab="explore" title="Explore"><i>✦</i>Explore</button>
      <button class="collapse" id="btnCollapse" title="Hide / show panel" aria-label="Hide or show the side panel">⟩</button>
    </div>
    <div class="pane on" id="p-layers"></div>
    <div class="pane" id="p-plan"></div>
    <div class="pane" id="p-cond"></div>
    <div class="pane" id="p-explore"></div>
  </aside>

  <div class="hud float" id="hud">
    <span>⌖ <b id="hudLL">—</b></span>
    <span title="Elevation under the cursor (MOLA)">⛰ <b id="hudEl">—</b></span>
    <span id="hudDistW" style="display:none" title="Distance from your habitat">↔ <b id="hudDist">—</b> from base</span>
    <span>☀ <b id="hudLt">—</b></span>
    <span>🔍 <b id="hudRes">—</b></span>
    <span class="k" id="hudLs">—</span>
    <span class="k" id="hudMtc">—</span>
  </div>

  <div id="profile" class="float"><canvas></canvas></div>
  <div id="simHud" class="float"></div>
  <div id="toast"></div>
  <div id="modeHint"></div>
  <div id="legend" class="float"><b>Slope hazard</b><br>
    <span class="sw" style="background:#3ccf8e"></span>&lt; 8° easy walking<br>
    <span class="sw" style="background:#f2b636"></span>8–15° suited limit<br>
    <span class="sw" style="background:#ff4d4d"></span>15–25° rover only<br>
    <span class="sw" style="background:#be1e8c"></span>&gt; 25° impassable</div>
  <div id="tour"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
// Backup CDN if unpkg is unreachable
if (!window.L) { document.write('<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"><script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"><\/script>'); }
// Show any startup error on the page instead of a silent black screen
window.addEventListener('error', e => { const d = document.createElement('div'); d.style.cssText = 'position:fixed;left:10px;bottom:10px;z-index:99999;background:#400;color:#fff;padding:8px 12px;border-radius:6px;font:12px monospace;max-width:80vw'; d.textContent = 'Error: ' + e.message + ' (' + (e.filename || '').split('/').pop() + ':' + e.lineno + ')'; document.body.appendChild(d); });
</script>
<script src="data.js"></script>
<script src="mars.js"></script>
<script src="app.js"></script>
<script src="extras.js"></script>
<script src="simple.js"></script>
<script src="detail.js"></script>
</body>
</html>
